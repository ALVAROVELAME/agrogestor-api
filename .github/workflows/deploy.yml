name: Deploy Agrogestor API

on:
  push:
    branches:
      - main

concurrency:
  group: agrogestor-production
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: self-hosted

    steps:
      - name: Verificar ambiente da VM
        run: |
          echo "===== SISTEMA ====="
          whoami
          uname -a

          echo "===== DOCKER ====="
          docker --version
          docker compose version

          echo "===== MEMORIA ====="
          free -h

          echo "===== DISCO ====="
          df -h

          echo "===== DOCKER USO ====="
          docker system df

      - name: Atualizar projeto na VM
        run: |
          cd /srv/apps

          if [ ! -d "agrogestor-api" ]; then
            git clone https://github.com/ALVAROVELAME/agrogestor-api.git
          fi

          cd agrogestor-api

          git fetch origin main
          git reset --hard "${{ github.sha }}"

          echo "Projeto atualizado"

      - name: Validar estrutura do projeto
        run: |
          cd /srv/apps/agrogestor-api

          test -f Dockerfile
          test -f docker-compose.yml
          test -f pom.xml

          echo "Arquivos principais encontrados"

      - name: Verificar container atual
        run: |
          docker ps

          if docker inspect agrogestor_api >/dev/null 2>&1
          then
            echo "Container atual encontrado"
          else
            echo "Primeira instalação"
          fi

      - name: Construir nova imagem usando cache
        run: |
          cd /srv/apps/agrogestor-api

          docker compose build --pull

      - name: Subir nova versão
        run: |
          cd /srv/apps/agrogestor-api

          docker compose up -d --remove-orphans

      - name: Aguardar a aplicação responder (Healthcheck dinâmico)
        run: |
          echo "Aguardando o Spring Boot iniciar e responder..."
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3002/v3/api-docs > /dev/null 2>&1; then
              echo "API respondeu com sucesso na tentativa $i!"
              exit 0
            fi
            echo "Tentativa $i/30: Aplicação ainda subindo, aguardando 3 segundos..."
            sleep 3
          done
          echo "Erro: A aplicação não respondeu a tempo."
          docker logs --tail 150 agrogestor_api
          exit 1

      - name: Verificar aplicação
        run: |
          echo "===== CONTAINERS ====="
          docker ps

          echo "===== LOGS API ====="
          docker logs --tail 100 agrogestor_api

      - name: Verificar consumo
        run: |
          docker stats --no-stream

      - name: Limpeza segura
        run: |
          docker image prune -f

          echo "Limpeza concluída"