name: Testes automatizados

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          
      - name: Testes unitários, HTTP e integração com MariaDB
        run: ./mvnw -B clean verify
        
      - name: Publicar resultados e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-e-cobertura
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/